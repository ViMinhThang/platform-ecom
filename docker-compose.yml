services:
  postgres:
    container_name: postgres
    image: postgres:17-alpine
    mem_limit: 700m
    environment:
      POSTGRES_USER: fragile
      POSTGRES_PASSWORD: 204863
      PGDATA: /var/lib/postgresql/data
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./init-multi-db.sh:/docker-entrypoint-initdb.d/init.sh
    ports:
      - "5432:5432"
    networks:
      - backend
    restart: unless-stopped

  kafka:
    container_name: kafka
    image: apache/kafka:3.9.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    networks:
      - backend
    restart: unless-stopped

  kafka-ui:
    container_name: kafka-ui
    image: provectuslabs/kafka-ui:latest
    mem_limit: 700m
    ports:
      - "9080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: kafka-learning
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka
    networks:
      - backend
    restart: unless-stopped

  # L09 platform. Services run on the host (bootRun) and register at
  # localhost:8761; gateway resolves lb:// names through eureka:8761.
  eureka:
    container_name: eureka
    build:
      context: ./platform-ecom-backend
      dockerfile: ./eureka/Dockerfile
    ports:
      - "8761:8761"
    networks:
      - backend
    restart: unless-stopped

  gateway:
    container_name: gateway
    build:
      context: ./platform-ecom-backend
      dockerfile: ./gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      EUREKA_URI: http://eureka:8761/eureka/
      OTLP_ENDPOINT: http://host.docker.internal:4318/v1/traces
    extra_hosts:
      # Linux docker needs this for host.docker.internal; no-op on Desktop.
      - "host.docker.internal:host-gateway"
    depends_on:
      - eureka
      - kafka
    networks:
      - backend
    restart: unless-stopped

  # L10 observability. Apps run on the host and push traces to the collector;
  # Prometheus scrapes them; Grafana ships one lab dashboard.
  otel-collector:
    container_name: otel-collector
    image: otel/opentelemetry-collector-contrib:0.110.0
    mem_limit: 256m
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    networks:
      - backend
    restart: unless-stopped

  jaeger:
    container_name: jaeger
    image: jaegertracing/all-in-one:1.62.0
    mem_limit: 512m
    ports:
      - "16686:16686"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    depends_on:
      - otel-collector
    networks:
      - backend
    restart: unless-stopped

  prometheus:
    container_name: prometheus
    image: prom/prometheus:v3.0.0
    mem_limit: 512m
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - backend
    restart: unless-stopped

  grafana:
    container_name: grafana
    image: grafana/grafana:11.4.0
    mem_limit: 256m
    ports:
      - "3000:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - backend
    restart: unless-stopped

networks:
  backend:
    driver: bridge

volumes:
  postgres:
