services:
  postgres:
    container_name: postgres
    image: postgres:17-alpine
    mem_limit: 700m
    environment:
      POSTGRES_USER: fragile
      POSTGRES_PASSWORD: 204863
      PGDATA: /var/lib/postgresql/data
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./init-multi-db.sh:/docker-entrypoint-initdb.d/init.sh
    ports:
      - "5432:5432"
    networks:
      - backend
    restart: unless-stopped

  kafka:
    container_name: kafka
    image: apache/kafka:3.9.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    networks:
      - backend
    restart: unless-stopped

  kafka-ui:
    container_name: kafka-ui
    image: provectuslabs/kafka-ui:latest
    mem_limit: 700m
    ports:
      - "9080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: kafka-learning
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka
    networks:
      - backend
    restart: unless-stopped

  # L09 platform. Services run on the host (bootRun) and register at
  # localhost:8761; gateway resolves lb:// names through eureka:8761.
  eureka:
    container_name: eureka
    build:
      context: ./platform-ecom-backend
      dockerfile: ./eureka/Dockerfile
    ports:
      - "8761:8761"
    networks:
      - backend
    restart: unless-stopped

  gateway:
    container_name: gateway
    build:
      context: ./platform-ecom-backend
      dockerfile: ./gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      EUREKA_URI: http://eureka:8761/eureka/
    depends_on:
      - eureka
      - kafka
    networks:
      - backend
    restart: unless-stopped

networks:
  backend:
    driver: bridge

volumes:
  postgres:
