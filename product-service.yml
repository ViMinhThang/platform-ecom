spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/products?currentSchema=public&stringtype=unspecified&serverTimezone=Asia/Ho_Chi_Minh
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:guest}
    connection-timeout: 30000
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
  kafka:
    bootstrap-servers: localhost:9093
  cloud:
    function:
      definition: orderCreated;stockUpdated
    stream:
      bindings:
        orderCreated-in-0:
          destination: order-created-topic
          group: product-service
        stockUpdated-in-0:
          destination: stock-updated-topic
          group: product-service
  jpa:
    database: POSTGRESQL
    show-sql: true
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  app:
    jwtSecret: "qweqweqweqweqweqw123123131231231cfcsvcxvwdfqsd"
    jwtExpirationMs: 600000
    jwtCookieName: "ecom"
server:
  port: 8084
image:
  base:
    url: uploads/products
management:
  endpoints:
    web:
      exposure:
        include: "*"
  tracing:
    sampling:
      probability: 1.0

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    preferIpAddress: true
logging:
  file:
    name: logs/${spring.application.name}.log
  logback:
    rollingpolicy:
      max-file-size: 5MB
      max-history: 7
