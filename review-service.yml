spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/reviews?currentSchema=public&stringtype=unspecified&serverTimezone=Asia/Ho_Chi_Minh
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:guest}
    connection-timeout: 30000
  jpa:
    database: POSTGRESQL
    show-sql: true
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  app:
    jwtSecret: "qweqweqweqweqweqw123123131231231cfcsvcxvwdfqsd"
    jwtExpirationMs: 600000
    jwtCookieName: "ecom"
  cloud:
    stream:
      kafka:
        binder:
          brokers: localhost:9092
      bindings:
        reviewCreated-out-0:
          destination: review-events
          content-type: application/json
        reviewUpdated-out-0:
          destination: review-events
          content-type: application/json
        reviewDeleted-out-0:
          destination: review-events
          content-type: application/json
server:
  port: 8087
management:
  endpoints:
    web:
      exposure:
        include: "*"
  tracing:
    sampling:
      probability: 1.0

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    preferIpAddress: true
logging:
  file:
    name: logs/${spring.application.name}.log
  logback:
    rollingpolicy:
      max-file-size: 5MB
      max-history: 7
