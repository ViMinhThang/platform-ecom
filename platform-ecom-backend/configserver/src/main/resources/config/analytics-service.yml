server:
  port: 8089

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/analytics
    username: fragile
    password: ${DB_PASSWORD:204863}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  cloud:
    stream:
      kafka:
        binder:
          brokers: localhost:9093
      bindings:
        user-event-out-0:
          destination: user-event-topic
          content-type: application/json
        order-created-in-0:
          destination: order-created-topic
          group: analytics-group
  
  data:
    redis:
      host: localhost
      port: 6379

management:
  endpoints:
    web:
      exposure:
        include: "*"
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
