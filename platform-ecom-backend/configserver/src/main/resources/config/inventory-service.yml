spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/inventory?currentSchema=public&stringtype=unspecified&serverTimezone=Asia/Ho_Chi_Minh
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    database: POSTGRESQL
    show-sql: true
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  cloud:
    function:
      definition: orderCreated
    stream:
      bindings:
        orderCreated-in-0:
          destination: order-created-topic
          group: inventory-service
        stockUpdated-out-0:
          destination: stock-updated-topic
        lowStockAlert-out-0:
          destination: low-stock-alert-topic
      kafka:
        binder:
          brokers: ${KAFKA_BROKERS:localhost:9093}
  app:
    jwtSecret: "qweqweqweqweqweqw123123131231231cfcsvcxvwdfqsd"
    jwtExpirationMs: 600000
    jwtCookieName: "ecom"

server:
  port: 8088

management:
  endpoints:
    web:
      exposure:
        include: "*"
  tracing:
    sampling:
      probability: 1.0

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    preferIpAddress: true

logging:
  file:
    name: logs/${spring.application.name}.log
  logback:
    rollingpolicy:
      max-file-size: 5MB
      max-history: 7
