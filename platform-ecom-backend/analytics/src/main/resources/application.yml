spring:
  application:
    name: analytics-service
  datasource:
    url: jdbc:postgresql://localhost:5432/analytics
    username: ${DB_USER:fragile}
    password: ${DB_PASSWORD:204863}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  jackson:
    serialization:
      write-dates-as-timestamps: false
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: analytics-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "com.ecom.common.event,java.util,java.time"
        spring.json.use.type.headers: false
    listener:
      ack-mode: manual_immediate
      missing-topics-fatal: false

server:
  port: 8091

# L06: semaphore bulkhead on trackEvent (HTTP + listener share it).
# Lab-sized: 10 concurrent, fail fast (max-wait 0) so bursts shed as 429.
resilience4j:
  bulkhead:
    instances:
      analyticsDb:
        max-concurrent-calls: 10
        max-wait-duration: 0

# L09: register with Eureka; gateway routes lb://analytics-service.
eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}

management:
  tracing:
    sampling:
      # L10 lab: trace everything; sample (e.g. 0.1) in prod.
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  health:
    bulkheads:
      enabled: true
