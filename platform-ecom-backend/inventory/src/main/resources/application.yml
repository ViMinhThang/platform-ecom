spring:
  application:
    name: inventory-service
  datasource:
    url: jdbc:postgresql://localhost:5432/inventory
    username: ${DB_USER:fragile}
    password: ${DB_PASSWORD:204863}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  jackson:
    serialization:
      write-dates-as-timestamps: false
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: inventory-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "com.ecom.common.event,java.util,java.time"
        spring.json.use.type.headers: false
    listener:
      ack-mode: manual_immediate
      missing-topics-fatal: false

server:
  port: 8088

# L05: retry transient DB failures (deadlock/lock-timeout live under
# TransientDataAccessException). Business outcomes are NOT retried.
resilience4j:
  retry:
    instances:
      inventoryDb:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2.0
        retry-exceptions:
          - org.springframework.dao.TransientDataAccessException
          - org.springframework.dao.CannotAcquireLockException
          - org.springframework.dao.QueryTimeoutException
        ignore-exceptions:
          - com.ecom.common.exception.APIException
          - com.ecom.common.exception.InsufficientStockException

# L09: register with Eureka; gateway routes lb://inventory-service.
eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
