spring:
  application:
    name: product-service
  config:
    import: "configserver:http://localhost:8888"
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
  cloud:
    function:
      definition: orderCreated
    stream:
      bindings:
        orderCreated-in-0:
          destination: order-created-topic
          group: product-service
