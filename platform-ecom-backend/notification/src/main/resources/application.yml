spring:
  application:
    name: notification-service
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          # L05: deadlines via native SMTP timeouts (no TimeLimiter needed
          # for a synchronous call).
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  jackson:
    serialization:
      write-dates-as-timestamps: false
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    consumer:
      group-id: notification-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "com.ecom.common.event,java.util,java.time"
        spring.json.use.type.headers: false
    listener:
      ack-mode: manual_immediate
      missing-topics-fatal: false

app:
  mail:
    from: ${SMTP_FROM:platform-ecom@no-reply.com}
    brand-name: ${MAIL_BRAND_NAME:Platform Ecom}
  web:
    base-url: ${WEB_BASE_URL:}

server:
  port: 8090

# L05: retry transient SMTP sends only. Auth failures are ignored —
# retrying bad credentials never succeeds.
resilience4j:
  retry:
    instances:
      mailSend:
        max-attempts: 3
        wait-duration: 1s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2.0
        retry-exceptions:
          - org.springframework.mail.MailSendException
        ignore-exceptions:
          - jakarta.mail.AuthenticationFailedException

  circuitbreaker:
    instances:
      mailSend:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        record-exceptions:
          - org.springframework.mail.MailSendException
        ignore-exceptions:
          - jakarta.mail.AuthenticationFailedException

# L09: register with Eureka; gateway routes lb://notification-service.
eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}

management:
  tracing:
    sampling:
      # L10 lab: trace everything; sample (e.g. 0.1) in prod.
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      # L06 lab visibility (breaker state in /actuator/health); never in prod.
      show-details: always
  health:
    circuitbreakers:
      enabled: true
logging:
  level:
    com.ecom.notification: INFO
