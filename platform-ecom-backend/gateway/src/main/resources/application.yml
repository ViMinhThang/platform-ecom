spring:
  application:
    name: gateway
  cloud:
    gateway:
      routes:
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/v1/order-groups/**,/api/v1/cart/**,/api/v1/sub-orders/**,/api/v1/admin/orders/**,/api/v1/admin/analytics/**,/api/v1/sagas/**
        - id: inventory-service
          uri: lb://inventory-service
          predicates:
            - Path=/api/v1/inventory/**,/api/v1/sellers/inventory/**,/api/v1/admin/inventory/**,/internal/inventory/**
        - id: analytics-service
          uri: lb://analytics-service
          predicates:
            - Path=/api/v1/analytics/**
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/v1/notifications/**
        # Lab console health: same-origin /actuator/health per service
        # (browser CORS blocks direct :808x fetches). No auth, no quota.
        - id: order-health
          uri: lb://order-service
          predicates:
            - Path=/labhealth/order/**
          filters:
            - SetPath=/actuator/health
        - id: inventory-health
          uri: lb://inventory-service
          predicates:
            - Path=/labhealth/inventory/**
          filters:
            - SetPath=/actuator/health
        - id: analytics-health
          uri: lb://analytics-service
          predicates:
            - Path=/labhealth/analytics/**
          filters:
            - SetPath=/actuator/health
        - id: notification-health
          uri: lb://notification-service
          predicates:
            - Path=/labhealth/notification/**
          filters:
            - SetPath=/actuator/health

# L09: edge-auth + lab rate limit. Secret shared with nothing — the gateway
# is the only verifier (minted by /labs/token).
app:
  jwt:
    secret: ${JWT_SECRET:lab-secret-32B-minimum-change-me-00}
    ttl-ms: 3600000
  ratelimit:
    max-requests: 100
    window-ms: 10000

server:
  port: 8080

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}

management:
  tracing:
    sampling:
      # L10 lab: trace everything; sample (e.g. 0.1) in prod.
      probability: 1.0
  otlp:
    tracing:
      # In docker the collector is reached via host; compose sets OTLP_ENDPOINT.
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
