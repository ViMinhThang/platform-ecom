spring:
  cloud:
    stream:
      bindings:
        orderNotification-in-0:
          destination: order-notifications
          group: notification-service-group
          content-type: application/json
      kafka:
        binder:
          brokers: localhost:9092

  # datasource:
  #   url: jdbc:postgresql://localhost:5432/users?currentSchema=public&stringtype=unspecified&serverTimezone=Asia/Ho_Chi_Minh
  #   username: ${DB_USER}
  #   password: ${DB_PASSWORD}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:guest}
    connection-timeout: 30000
  # jpa:
  #   database: POSTGRESQL
  #   show-sql: true
  #   hibernate:
  #     ddl-auto: update
  #   database-platform: org.hibernate.dialect.PostgreSQLDialect
  # app:
  #   jwtSecret: "qweqweqweqweqweqw123123131231231cfcsvcxvwdfqsd"
  #   jwtExpirationMs: 600000
  #   jwtCookieName: "ecom"
server:
  port: 8086

management:
  endpoints:
    web:
      exposure:
        include: "*"
  tracing:
    sampling:
      probability: 1.0

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    preferIpAddress: true
logging:
  file:
    name: logs/${spring.application.name}.log
  logback:
    rollingpolicy:
      max-file-size: 5MB
      max-history: 7
